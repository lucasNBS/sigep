<label class="{{ widget.label_class }}" for="{{ widget.attrs.id }}">{{ widget.label }}</label>
<select class="{{ widget.input_class }}" id="{{ widget.attrs.id }}" name="{{ widget.name }}">
  {% for group_name, group_choices, group_index in widget.optgroups %}
    {% for option in group_choices %}
      <option value="{{ option.value|stringformat:'s' }}">{{ option.label }}</option>
    {% endfor %}
  {% endfor %}
</select>
