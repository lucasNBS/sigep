{% extends 'base.html' %}
{% load static %}

{% block head %}
  <link rel="stylesheet" href="{% static 'css/inventory.css' %}">
{% endblock %}

{% block main %}
<div class="main-container">
  <div class="top-container">
    <h2 class="main-title">Inventários</h2>
    <div class="actions-container">
      <div class="action-button filter" data-open-modal-filter>
        <img class="action-icon" src="{% static 'icons/Filter.svg' %}" alt="Filtro">
        <span>Filtro</span>
      </div>
      <a href="{% url 'inventory-create' institution %}">
        <div class="action-button action">
          <img class="action-icon" src="{% static 'icons/Clipboard.svg' %}" alt="Abrir Processo de Inventário">
          <span>Abrir Processo de Inventário</span>
        </div>
      </a>
    </div>
  </div>
  {% include 'partials/table.html' with type='inventory' %}
</div>
{% include 'partials/filter-base.html' with type='inventory' %}
{% endblock %}
