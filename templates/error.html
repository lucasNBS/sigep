{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/global.css' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/error.css' %}" />
  <title>SIGEP - Sistema de Gerenciamento de Estoque e Patrimônio</title>
</head>
<body class="background">
  <main class="main">
    <h1 class="error-title">Erro</h1>

    <p class="error-text">{{ message }}</p>

    <button class="action cancel" onclick="window.history.back()">
      <img class="action-icon" src="{% static 'icons/Arrow.svg' %}" alt="Voltar">
      Voltar
    </button>
  </main>
</body>
</html>
