{% extends "base-login.html" %}
{% load static %}

{% block head %}
  <link rel="stylesheet" href="{% static 'css/new-password.css' %}" />
  <script src="{% static 'js/new-password.js' %}" defer></script>
{% endblock %}

{% block main %}
<div class="login-form-container">
  <form class="login-form" method="POST">
    {% csrf_token %}

    <input type="hidden" name="next" value="{{ next|default:'' }}">

    <h1 class="login-form-title">Redefinir Senha</h1>
    <p class="login-form-subtitle">Defina sua nova senha de acesso</p>

    <div class="input-group">
      <div class="input-with-toggle">
        <div class="password-input-group">
          <label class="input-label" for="new_password1">Nova Senha</label>
          <input
            class="input-field"
            type="password"
            id="new_password1"
            name="new_password1"
            placeholder="Digite sua nova senha"
            required
            autocomplete="new-password"
          />
        </div>
        <div class="password-visibility-toggle">
          <button
            type="button"
            class="toggle-password-visibility toggle-password-visibility-1"
          >
            <img
              src="{% static 'icons/CrossedEye.svg' %}"
              alt="Alterar visibilidade da senha"
            />
          </button>
        </div>
      </div>
    </div>

    <div class="input-group">
      <div class="input-with-toggle">
        <div class="password-input-group">
          <label class="input-label" for="new_password2">Repetir Senha</label>
          <input
            class="input-field"
            type="password"
            id="new_password2"
            name="new_password2"
            placeholder="Digite sua senha"
            required
            autocomplete="new-password"
          />
        </div>
        <div class="password-visibility-toggle">
          <button
            type="button"
            class="toggle-password-visibility toggle-password-visibility-2"
          >
            <img
              src="{% static 'icons/CrossedEye.svg' %}"
              alt="Alterar visibilidade da senha"
            />
          </button>
        </div>
      </div>
    </div>

    <div class="login-form-footer">
      <button type="submit" class="login-button-link">
        Redefinir Senha
      </button>
    </div>
  </form>
</div>
{% endblock %}
