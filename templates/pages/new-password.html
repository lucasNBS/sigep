{% extends "base-login.html" %} {% load static %}

{% block head %}
  <link rel="stylesheet" href="{% static 'css/new-password.css' %}" />
  <script src="{% static 'js/new-password.js' %}" defer></script>
{% endblock %}
{% block main %}
<div class="login-form-container">
  <form class="login-form" method="POST">
    {% csrf_token %}
    <h1 class="login-form-title">Bem-vindo de volta!</h1>
    <p class="login-form-subtitle">Entre na sua conta</p>
    <div class="input-group">
      <div class="input-with-toggle">
        <div class="password-input-group">
          <label class="input-label" for="password1">Senha</label>
          <input
            class="input-field"
            type="password"
            id="password1"
            name="password1"
            placeholder="Digite sua senha"
            required
          />
        </div>
        <div class="password-visibility-toggle">
          <button
            type="button"
            class="toggle-password-visibility toggle-password-visibility-1"
          >
            <img
              src="{% static 'icons/CrossedEye.svg' %}"
              alt="Alterar visibilidade da senha"
            />
          </button>
        </div>
      </div>
    </div>
    <div class="input-group">
      <div class="input-with-toggle">
        <div class="password-input-group">
          <label class="input-label" for="password2">Repetir Senha</label>
          <input
            class="input-field"
            type="password"
            id="password2"
            name="password2"
            placeholder="Digite sua senha"
            required
          />
        </div>
        <div class="password-visibility-toggle">
          <button
            type="button"
            class="toggle-password-visibility toggle-password-visibility-2"
          >
            <img
              src="{% static 'icons/CrossedEye.svg' %}"
              alt="Alterar visibilidade da senha"
            />
          </button>
        </div>
      </div>
    </div>
    <div class="login-form-footer">
      <a href="{% url 'signin' %}" class="login-button-link">Redefinir Senha</a>
    </div>
  </form>
</div>
{% endblock %}
